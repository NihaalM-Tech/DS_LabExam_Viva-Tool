<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#14232b;--mut:#51666f;--line:#c9d6dc;--acc:#0b6b73;--hl:#ffe58a;--hlink:#5a4300;--ok:#1f7a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#9bb0b8;--line:#2d424b;--acc:#5fd0d9;--hl:#4a3b00;--hlink:#ffe58a;--ok:#6fdc9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1f;--card:#17262d;--ink:#e6eef1;--mut:#9bb0b8;--line:#2d424b;--acc:#5fd0d9;--hl:#4a3b00;--hlink:#ffe58a;--ok:#6fdc9a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:860px;margin:0 auto}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.bar-in{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}

.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.tools button{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:14px}
.tools button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:600}
main{max-width:860px;margin:0 auto;padding:12px 16px 60px}
.prog{font-size:14px;color:var(--mut);margin:4px 0 12px}

.qa{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0}
.q{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-weight:600}

.qa.hide .a{display:none}
.a ul{margin:4px 0 4px 18px;padding:0}

<header><h1>Data Structures: Viva Study Tool</h1>
<p class="sub">Tap a question to open the answer. Use “Quiz mode” to hide answers and test yourself.</p></header>
<div class="bar"><div class="bar-in">
<div class="tabs" id="tabs" role="group" aria-label="Topics"></div>

<input type="search" id="s" placeholder="Search any question or keyword" aria-label="Search">

<button id="unk">Only unknown</button>
</div></div></div>

<script>
var S=[
{id:"def",t:"Definitions and uses",n:[
["Define data structure. Why do we need it?","A way of organizing and storing data in memory so it can be accessed and modified <b>efficiently</b>. Choice of structure decides the speed and memory of an algorithm."],
["Primitive vs non-primitive; linear vs non-linear.","<ul><li><b>Primitive:</b> int, char, float, pointer.</li><li><b>Non-primitive:</b> array, list, stack, queue, tree, graph.</li><li><b>Linear:</b> elements in a sequence (array, linked list, stack, queue).</li><li><b>Non-linear:</b> hierarchical or networked (tree, graph).</li></ul>"],
["Define array. Applications?","Fixed-size collection of same-type elements in contiguous memory, accessed by index in O(1).<br>Uses: storing lists, matrices, lookup tables, base for stack, queue, heap, hash tables."],
["Define linked list. Applications?","Collection of nodes, each holding data and a pointer to the next node. Dynamic size, easy insert/delete, no random access.<br>Uses: stack/queue implementation, polynomial representation, music playlist, undo chain, memory management."],
["Define stack. Applications?","Linear structure where insertion and deletion happen at one end (top). <b>LIFO</b>.<br>Uses: function call (recursion), undo/redo, expression evaluation, infix to postfix, balanced parentheses, browser back button, DFS."],
["Define queue. Applications?","Linear structure with insertion at rear and deletion at front. <b>FIFO</b>.<br>Uses: CPU/job scheduling, printer spooling, BFS, buffers (keyboard, IO), call-centre waiting line."],
["Define circular queue, dequeue, priority queue.","<ul><li><b>Circular queue:</b> last position connects back to the first.</li><li><b>Dequeue (double-ended):</b> insert and delete at both ends.</li><li><b>Priority queue:</b> element with highest priority leaves first.</li></ul>Uses: round-robin scheduling (circular), sliding window and palindrome check (dequeue), Dijkstra and OS scheduling (priority)."],
["Define tree and binary tree. Applications?","Tree: non-linear hierarchical structure of nodes with one root and no cycles. Binary tree: each node has at most 2 children.<br>Uses: file systems, expression trees, searching (BST), Huffman coding, heaps, database indexing, DOM."],
["Define graph. Applications?","Set of vertices connected by edges (directed or undirected, weighted or not).<br>Uses: maps and shortest path, social networks, network routing, dependency/scheduling, web page links."],
["Define hashing and hash table.","Maps a key to an index using a hash function for ~O(1) search. Collisions handled by chaining or open addressing.<br>Uses: symbol tables, dictionaries, caches, databases."]]},
{id:"sq",t:"Stack and queue",n:[
["State the principle of stack and queue.","Stack: <b>LIFO</b> (last in, first out). Queue: <b>FIFO</b> (first in, first out)."],
["List stack operations with their conditions.","<ul><li><code>push(x)</code>: add at top. Check <b>overflow</b> (top == MAX-1).</li><li><code>pop()</code>: remove from top. Check <b>underflow</b> (top == -1).</li><li><code>peek()</code>: read top without removing.</li><li><code>isEmpty()</code>, <code>isFull()</code>.</li></ul>Array stack starts with <code>top = -1</code>. Push: <code>stack[++top]=x</code>. Pop: <code>x=stack[top--]</code>."],
["List queue operations with their conditions.","<ul><li><code>enqueue(x)</code>: insert at rear. Overflow if rear == MAX-1.</li><li><code>dequeue()</code>: delete at front. Underflow if front &gt; rear or empty.</li><li><code>front()</code>, <code>isEmpty()</code>, <code>isFull()</code>.</li></ul>Initially <code>front = rear = -1</code>."],
["What is overflow and underflow?","<b>Overflow:</b> inserting into a full structure. <b>Underflow:</b> deleting from an empty structure."],
["Time complexity of push, pop, enqueue, dequeue?","All are <b>O(1)</b> in a proper implementation."],
["Evaluate postfix <code>5 3 2 * +</code>.","Scan left to right. Operand: push. Operator: pop two (second popped is the left operand), apply, push result.<br>5, 3, 2 pushed. <code>*</code> gives 3*2=6. <code>+</code> gives 5+6 = <b>11</b>."],
["Convert infix <code>A+B*C</code> to postfix.","Precedence: <code>^</code> &gt; <code>* /</code> &gt; <code>+ -</code>. Operands go to output; operators wait on the stack until a higher or equal precedence operator arrives.<br>Answer: <code>ABC*+</code>."],
["How can you implement a queue using two stacks (or a stack using queues)?","Queue with two stacks: push into stack1; on dequeue, if stack2 is empty move all of stack1 into stack2, then pop stack2. Amortised O(1)."]]},
{id:"qd",t:"Differences",n:[
["Circular queue vs linear queue. Advantage of circular queue?","<table><tr><th>Linear queue</th><th>Circular queue</th></tr><tr><td>Rear stops at MAX-1</td><td>Rear wraps to index 0</td></tr><tr><td>Freed front slots are wasted</td><td>Freed slots are reused</td></tr><tr><td>Can say full while space exists</td><td>Full only when truly full</td></tr><tr><td>rear+1</td><td>(rear+1) % MAX</td></tr></table><div class='note'><b>Must note:</b> main advantage is <b>efficient memory utilisation</b>, no wasted space after deletions. Full condition: <code>(rear+1)%MAX == front</code>.</div>"],
["Queue vs dequeue.","<table><tr><th>Queue</th><th>Dequeue (deque)</th></tr><tr><td>Insert at rear only</td><td>Insert at both ends</td></tr><tr><td>Delete at front only</td><td>Delete at both ends</td></tr><tr><td>Strict FIFO</td><td>Can act as stack or queue</td></tr></table>Types of dequeue: input-restricted and output-restricted."],
["Linear search tree vs binary search tree (use of linear search vs BST).","<table><tr><th>Linear search</th><th>Binary search tree</th></tr><tr><td>Sequential scan of a list</td><td>Left &lt; root &lt; right ordering</td></tr><tr><td>Works on unsorted data</td><td>Built by ordered insertion</td></tr><tr><td>O(n) always</td><td>O(log n) average, O(n) worst (skewed)</td></tr></table>"],
["Linear search vs binary search.","<table><tr><th></th><th>Linear</th><th>Binary</th></tr><tr><td>Sorted needed?</td><td>No</td><td><b>Yes</b></td></tr><tr><td>Best / worst</td><td>O(1) / O(n)</td><td>O(1) / O(log n)</td></tr><tr><td>Structure</td><td>Array or linked list</td><td>Needs random access (array)</td></tr></table>"],
["Stack vs queue. Array vs linked list.","Stack: one end, LIFO. Queue: two ends, FIFO.<br>Array: fixed size, O(1) access, costly insert. Linked list: dynamic, O(n) access, O(1) insert at known position, extra pointer memory."],
["Tree vs graph. Binary tree vs BST.","Tree: no cycles, one root, n-1 edges. Graph: may have cycles, no root needed.<br>Binary tree: any arrangement, at most 2 children. BST: ordered, so search is fast."]]},
{id:"sort",t:"Sorting",n:[
["Explain insertion sort.","Take each element and insert it into its correct place within the already-sorted left part by shifting larger elements right. Stable, in-place, good for small or nearly sorted data. Similar to arranging playing cards."],
["Number of passes and comparisons in insertion sort?","<ul><li><b>Passes:</b> n-1 (starting from the 2nd element).</li><li><b>Best case</b> (already sorted): n-1 comparisons, O(n).</li><li><b>Worst case</b> (reverse sorted): 1+2+...+(n-1) = <b>n(n-1)/2</b> comparisons, O(n²).</li></ul>Example n=5: 4 passes; worst 10 comparisons; best 4."],
["Explain selection sort. Passes and comparisons?","Find the minimum of the unsorted part and swap it to the front position. Repeat.<br>Passes: n-1. Comparisons: always <b>n(n-1)/2</b> in every case, so O(n²) best, average, worst. At most n-1 swaps. Not stable."],
["Explain bubble sort.","Compare adjacent pairs and swap if out of order; the largest bubbles to the end each pass. Passes n-1. With a swap flag, best case is O(n) (one pass, n-1 comparisons). Worst O(n²). Stable."],
["Explain quick sort.","Divide and conquer: choose a <b>pivot</b>, partition so smaller elements go left and larger go right, then recursively sort both parts.<br>Best/average O(n log n). Worst O(n²) when pivot is always min or max (e.g., sorted input with first-element pivot). In-place, not stable, space O(log n) for recursion."],
["Explain merge sort.","Divide the array into halves, sort each, merge. Always O(n log n). Needs O(n) extra space. Stable."],
["Complexity table (memorise).","<table><tr><th>Sort</th><th>Best</th><th>Avg</th><th>Worst</th><th>Stable</th></tr><tr><td>Bubble</td><td>n*</td><td>n²</td><td>n²</td><td>Yes</td></tr><tr><td>Selection</td><td>n²</td><td>n²</td><td>n²</td><td>No</td></tr><tr><td>Insertion</td><td>n</td><td>n²</td><td>n²</td><td>Yes</td></tr><tr><td>Quick</td><td>n log n</td><td>n log n</td><td>n²</td><td>No</td></tr><tr><td>Merge</td><td>n log n</td><td>n log n</td><td>n log n</td><td>Yes</td></tr><tr><td>Heap</td><td>n log n</td><td>n log n</td><td>n log n</td><td>No</td></tr></table><small>*with swap flag</small>"],
["What is a stable sort? In-place sort?","Stable: equal keys keep their original relative order. In-place: uses only O(1) extra memory (apart from recursion)."],
["Which sort is best for nearly sorted data? Which for large data?","Nearly sorted or small: <b>insertion sort</b>. Large data: merge or quick sort (O(n log n))."]]},
{id:"search",t:"Searching",n:[
["Explain linear search.","Check each element one by one from the start until the key is found or the list ends. Works on unsorted data. Best O(1), average and worst O(n)."],
["Explain binary search. Conditions?","Needs a <b>sorted</b> array with random access. Compare key with the middle; if equal, done; if smaller search left half, else right half.<br><code>mid = (low+high)/2</code>. Loop while <code>low &lt;= high</code>.<br>Best O(1), average and worst <b>O(log n)</b>. Max comparisons about log₂n + 1."],
["How many comparisons for binary search in 1000 elements?","At most ⌊log₂1000⌋ + 1 = <b>10</b>."],
["Why does binary search not work on a linked list efficiently?","No O(1) access to the middle node, so finding mid costs O(n)."],
["What is hashing as a searching method?","Index computed from the key gives O(1) average search; needs collision handling."]]},
{id:"cx",t:"Complexity",n:[
["Define time complexity and space complexity.","Time: number of basic operations as a function of input size n. Space: extra memory used as a function of n."],
["Explain best, average, worst case.","Best: minimum work (e.g., key at first position). Average: expected over all inputs. Worst: maximum work (e.g., key absent). Worst case is the usual guarantee."],
["Name and define the asymptotic notations.","<ul><li><b>Big O (O):</b> upper bound, f(n) ≤ c·g(n) for n ≥ n₀. Used for worst case.</li><li><b>Omega (Ω):</b> lower bound, f(n) ≥ c·g(n). Best case.</li><li><b>Theta (Θ):</b> tight bound, both O and Ω.</li><li><b>Little o, ω:</b> strict (not tight) bounds.</li></ul>"],
["Order the growth rates.","<code>O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n³) &lt; O(2ⁿ) &lt; O(n!)</code>"],
["Complexity of common operations.","<table><tr><th>Operation</th><th>Time</th></tr><tr><td>Array access / push / pop</td><td>O(1)</td></tr><tr><td>Array insert/delete in middle</td><td>O(n)</td></tr><tr><td>Linked list insert at head</td><td>O(1)</td></tr><tr><td>Linked list search</td><td>O(n)</td></tr><tr><td>BST search (avg / worst)</td><td>O(log n) / O(n)</td></tr><tr><td>Heap insert / delete</td><td>O(log n)</td></tr></table>"],
["Find complexity of: <code>for(i=1;i&lt;n;i*=2)</code>","i doubles each time, so loop runs log₂n times: <b>O(log n)</b>. Nested loops 0..n each: O(n²)."]]},
{id:"sm",t:"Sparse matrix",n:[
["What is a sparse matrix? Why special representation?","A matrix in which most elements are zero (non-zero count much smaller than m×n). Storing only non-zero elements saves memory and time."],
["Explain 3-tuple (triplet) representation.","Store each non-zero element as (row, column, value). First row stores the matrix header: (total rows, total columns, number of non-zero elements).<br>Example 4×4 matrix with 3 non-zeros:<table><tr><th>Row</th><th>Col</th><th>Value</th></tr><tr><td>4</td><td>4</td><td>3</td></tr><tr><td>0</td><td>2</td><td>5</td></tr><tr><td>1</td><td>0</td><td>8</td></tr><tr><td>3</td><td>3</td><td>6</td></tr></table>Array size: (t+1) × 3 where t = non-zeros."],
["How to find the transpose of a sparse matrix?","Transpose swaps row and column of every triple, then the triples must be re-ordered by new row.<br><b>Simple method:</b> for each column c from 0 to cols-1, scan all triples; when col == c, write (c, row, val). Time O(cols × t).<br><b>Fast transpose:</b> count non-zeros per column and compute starting positions, then place each triple directly. Time O(cols + t)."],
["When is the sparse representation worth it?","When 3(t+1) &lt; m × n, i.e. non-zeros are fewer than about one third of all cells."],
["Applications of sparse matrices?","Graph adjacency matrices, scientific computing, image processing, text/term matrices, recommendation systems."]]},
{id:"tree",t:"Trees",n:[
["Define the tree terms.","Root, parent, child, leaf (no children), sibling, level, <b>height</b> (longest path to a leaf), depth, degree. Complete binary tree with height h has up to 2^(h+1) - 1 nodes."],
["Give the three DFS traversals.","<ul><li><b>Inorder:</b> Left, Root, Right</li><li><b>Preorder:</b> Root, Left, Right</li><li><b>Postorder:</b> Left, Right, Root</li></ul><div class='tip'><b>Trick:</b> the word tells where the <b>Root</b> sits. PRE = root first, IN = root in the middle, POST = root last.</div>"],
["Example traversal.","Tree: root 1, left child 2 (children 4, 5), right child 3.<br>Inorder: <code>4 2 5 1 3</code><br>Preorder: <code>1 2 4 5 3</code><br>Postorder: <code>4 5 2 3 1</code><br>Level order (BFS): <code>1 2 3 4 5</code>"],
["Inorder of a BST gives what?","Elements in <b>sorted ascending order</b>. Great viva point."],
["Which traversal is used for what?","Inorder: sorted output from BST. Preorder: copy a tree, prefix expression. Postorder: delete a tree, postfix expression. Level order: BFS using a queue."],
["BST insertion, search, deletion.","Insert/search: compare with node; go left if smaller, right if larger. Delete: 0 children remove; 1 child replace by child; 2 children replace with inorder successor (or predecessor), then delete that node."],
["Can you rebuild a tree from one traversal?","No. You need <b>inorder + preorder</b> or <b>inorder + postorder</b>. Preorder/postorder alone do not give a unique tree."],
["Other trees: AVL, heap, complete, full.","AVL: self-balancing BST (balance factor -1, 0, 1). Heap: complete tree with parent ≥ children (max-heap) or ≤ (min-heap). Full: every node has 0 or 2 children. Complete: all levels full except possibly last, filled left to right."]]},
{id:"poly",t:"Polynomial",n:[
["How is a polynomial represented using a linked list?","Each node: <code>coefficient | exponent | next</code>, kept in descending order of exponent. Example 5x³ + 2x - 7 is (5,3) → (2,1) → (-7,0)."],
["How is polynomial addition done?","Use two pointers. Equal exponents: add coefficients (skip if sum is 0). Otherwise copy the term with the larger exponent and advance that pointer. Copy remaining terms. Time O(m+n)."],
["Where are polynomials used?","Symbolic algebra systems, computer graphics curves, signal processing, error-correcting codes, numerical analysis, scientific calculation, cryptography."],
["Why linked list instead of array for polynomials?","Sparse polynomials like x¹⁰⁰ + 1 would waste a huge array. Linked list stores only non-zero terms and grows dynamically."]]},
{id:"tips",t:"Tricks and must-notes",n:[
["Must-note one-liners.","<div class='note'><ul><li>Stack = LIFO, Queue = FIFO.</li><li>Binary search needs sorted data. O(log n).</li><li>Insertion sort passes = n-1; worst comparisons = n(n-1)/2.</li><li>Selection sort always n(n-1)/2 comparisons.</li><li>Quick sort worst case O(n²) on sorted data with bad pivot.</li><li>Circular queue = no wasted space.</li><li>BST inorder = sorted.</li><li>Sparse matrix 3-tuple first row = (rows, cols, non-zeros).</li></ul></div>"],
["Viva answering tips.","<div class='tip'><ul><li>Start with the <b>definition</b>, then one <b>example</b>, then <b>complexity or application</b>.</li><li>Always mention the <b>condition</b> (sorted array, overflow check, base case).</li><li>If you are asked for code, say the algorithm steps first, then write it.</li><li>Quote complexity as best / average / worst.</li><li>If unsure, say what you know, do not stay silent.</li></ul></div>"],
["Memory tricks.","<ul><li><b>LIFO</b> = pile of plates; <b>FIFO</b> = ticket line.</li><li>Insertion sort = arranging cards in hand.</li><li>Selection sort = pick the smallest each time.</li><li>Pre/In/Post = position of Root.</li><li>Empty stack top = -1; empty queue front = rear = -1.</li></ul>"],
["Common mistakes to avoid.","<ul><li>Saying binary search works on unsorted data.</li><li>Mixing up overflow (full) and underflow (empty).</li><li>Forgetting circular queue uses modulo.</li><li>Writing quick sort worst case as O(n log n).</li><li>Forgetting the header row in 3-tuple.</li></ul>"],
["Lab-day checklist.","Know how to write: stack and queue using array, circular queue, insertion/selection/quick sort, linear and binary search, tree traversals with recursion, sparse matrix 3-tuple and transpose, polynomial add. Practise tracing each with a small example by hand."]]}
];
var cur="all",quiz=false,onlyUnk=false,shuffle=false,known={};
var tabs=document.getElementById("tabs"),out=document.getElementById("out");
function mk(id,t){var b=document.createElement("button");b.textContent=t;b.setAttribute("aria-pressed",cur===id);b.onclick=function(){cur=id;render()};tabs.appendChild(b)}
function total(){var c=0;S.forEach(function(s){c+=s.n.length});return c}
function render(){
 tabs.innerHTML="";mk("all","All");S.forEach(function(s){mk(s.id,s.t)});
 var q=document.getElementById("s").value.toLowerCase().trim(),html="",shown=0;
 var list=S.filter(function(s){return cur==="all"||s.id===cur});
 out.innerHTML="";
 list.forEach(function(s){
  var items=s.n.map(function(x,i){return {q:x[0],a:x[1],k:s.id+i}});
  items=items.filter(function(x){return (!q||(x.q+x.a).toLowerCase().indexOf(q)>-1)&&(!onlyUnk||!known[x.k])});
  if(shuffle)items.sort(function(){return Math.random()-.5});
  if(!items.length)return;
  var h=document.createElement("h2");h.textContent=s.t;out.appendChild(h);
  items.forEach(function(x){shown++;
   var d=document.createElement("div");d.className="qa"+(quiz?" hide":"");
   var b=document.createElement("button");b.className="q";b.setAttribute("aria-expanded",!quiz);b.textContent=x.q;
   var a=document.createElement("div");a.className="a";a.innerHTML=x.a;
   var k=document.createElement("label");k.className="known";
   var c=document.createElement("input");c.type="checkbox";c.checked=!!known[x.k];
   c.onchange=function(){known[x.k]=c.checked;prog()};
   k.appendChild(c);k.appendChild(document.createTextNode(" I know this"));a.appendChild(k);
   b.onclick=function(){var h=d.classList.toggle("hide");b.setAttribute("aria-expanded",!h)};
   d.appendChild(b);d.appendChild(a);out.appendChild(d)});
 });
 if(!shown)out.innerHTML='<p class="empty">No questions match. Clear the search or turn off “Only unknown”.</p>';
 prog();
}

 document.getElementById("prog").innerHTML="Known: "+n+" of "+t+" questions<div class='meter'><i style='width:"+(n/t*100)+"%'></i></div>"}
